name: CI / CD Quality Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-qa:
    name: Backend QA (PHP 8.2 / Laravel 12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Environment
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Check Code Style (Laravel Pint)
        run: |
          cd backend
          ./vendor/bin/pint --test

      - name: Static Analysis (PHPStan / Larastan Level 6)
        run: |
          cd backend
          ./vendor/bin/phpstan analyse

      - name: Run Tests (PHPUnit)
        run: |
          cd backend
          php artisan test

  frontend-qa:
    name: Frontend QA (Vue 3 / TypeScript / ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint and Strict Zero-Any Verification (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: TypeScript TypeCheck and Vite Build
        run: |
          cd frontend
          npm run build
